[project]
name = "littax"
version = "0.1.0"
description = "Discover a multi-level topic taxonomy from a folder of research PDFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Phase 2: real sentence embeddings + UMAP. Pulls in PyTorch (~2.5 GB).
ml = [
    "sentence-transformers>=3.0",
    "umap-learn>=0.5.6",
]
# Folder naming. Both providers ship together - which one runs is a config key.
llm = [
    "anthropic>=0.69",   # Claude on Microsoft Foundry
    "openai>=1.50",      # GPT on Azure OpenAI
]
# Phase 4: local viewer.
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
littax = "littax.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/littax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
